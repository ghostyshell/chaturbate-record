[workspace]
resolver = "2"
members = ["core", "cli", "app/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Chaturbate Recorder"]
repository = "https://github.com/ghostyshell/chaturbate-record"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", features = ["json", "tls", "socks-proxy", "cookies"] }
directories = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
